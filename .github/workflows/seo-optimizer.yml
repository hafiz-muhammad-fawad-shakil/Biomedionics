name: 🤖 Groq SEO Auto-Optimizer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  seo_optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: pip install groq

      - name: 🤖 Run SEO Optimizer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python seo_optimizer.py

      - name: 💾 Commit SEO Changes
        run: |
          git config --global user.name "Groq SEO Bot"
          git config --global user.email "seo-bot@biomedionics.live"
          git add .
          git diff --staged --quiet || git commit -m "🤖 Auto SEO improvement by Groq AI"
          git push
